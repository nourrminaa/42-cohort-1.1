[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Maze Generation Library"
requires-python = ">=3.10"
dependencies = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mazegen = ["py.typed"]
